
name: Build and Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Check generated website
        run: npm run check

      - name: Checkout deployment repository
        uses: actions/checkout@v4
        with:
          repository: Abdo-DFIR/Abdo-DFIR.github.io
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: deployment

      - name: Publish generated website
        run: |
          rsync -a --delete --exclude='.git/' dist/ deployment/
          git -C deployment config user.name "github-actions[bot]"
          git -C deployment config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C deployment add --all

          if git -C deployment diff --cached --quiet; then
            echo "Generated website is already up to date."
          else
            git -C deployment commit -m "Deploy portfolio from ${GITHUB_SHA}"
            git -C deployment push origin HEAD:main
          fi
